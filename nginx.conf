server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cada idioma es un HTML estático: / (español), /en.html y /pt.html.
    # Las URLs antiguas /es/, /en/ y /pt/ redirigen a su página.
    location ~ ^/es/?$ {
        return 301 /;
    }
    location ~ ^/(en|pt)/?$ {
        return 301 /$1.html;
    }

    # Manejo de SPA - intenta servir el archivo, si no existe sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
